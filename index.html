<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See your website on every screen at once." />
    <meta name="color-scheme" content="dark" />
    <script>
      // The saved theme before the first paint, so a light setup never flashes dark (src/main.js keeps it in sync).
      try {
        if (JSON.parse(localStorage.getItem('bezel:v1') || '{}').theme === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
    <title>Bezel</title>
  </head>
  <body>
    <header class="toolbar">
      <a class="brand" href="./" aria-label="Bezel home">
        <img class="brand__mark" src="./src/assets/logo-mark.svg" alt="" width="21" height="24" />
        <span class="brand__name">Bezel</span>
      </a>
      <!-- In the Windows app, clicking the version checks for updates. -->
      <button class="brand__version" id="app-version" type="button" disabled></button>

      <form class="address" id="address-form" autocomplete="off">
        <label class="visually-hidden" for="address-input">Website address</label>
        <div class="address__field">
          <button class="address__reload" id="reload-btn" type="button" aria-label="Reload all devices" title="Reload all devices (Alt+Shift+R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v5h-5" /></svg>
          </button>
          <input
            id="address-input"
            class="address__input"
            type="text"
            inputmode="url"
            spellcheck="false"
            placeholder="localhost:3000"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="address-list"
          />
          <button class="address__star" id="favorite-btn" type="button" aria-pressed="false" aria-label="Add to favorites" title="Add to favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" /></svg>
          </button>
        </div>
        <button class="address__go" type="submit">Open</button>
        <!-- Favorites, then recent sites (src/address-list.js) -->
        <div class="address__list" id="address-list" role="listbox" aria-label="Favorite and recent sites" hidden></div>
      </form>

      <div class="controls">
        <button class="icon-btn" id="shot-btn" type="button" aria-label="Copy a screenshot of the devices" title="Copy a screenshot of the devices (Alt+C)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5A1.5 1.5 0 0 1 5 7h2.4l1.5-2.2h6.2L16.6 7H19a1.5 1.5 0 0 1 1.5 1.5v9.5A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z" /><circle cx="12" cy="13" r="3.6" /></svg>
        </button>
        <button class="icon-btn" id="sync-btn" type="button" aria-label="Sync scrolling" title="Sync scrolling (Alt+S)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="7.5" height="17" rx="2" /><rect x="13.5" y="3.5" width="7.5" height="17" rx="2" /><path d="M6.75 15V9M4.75 11l2-2 2 2M17.25 15V9M15.25 11l2-2 2 2" /></svg>
        </button>
        <button class="icon-btn" id="rotate-btn" type="button" aria-label="Rotate" title="Rotate (Alt+R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="14" height="11" rx="2" /><path d="M10 4h4a6 6 0 0 1 6 6v1" /><path d="m17.5 8.5 2.5 2.5 2.5-2.5" /></svg>
        </button>

        <div class="segmented" role="group" aria-label="View">
          <button type="button" data-mode="grid" title="All devices (Alt+0)">All devices</button>
          <button type="button" data-mode="focus" title="One device (Alt+1 to Alt+5)">One device</button>
        </div>

        <label class="zoom">
          <span class="visually-hidden">Zoom</span>
          <select id="zoom-select">
            <option value="fit">Fit</option>
            <option value="0.25">25%</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
          </select>
        </label>

        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch to light theme" title="Switch to light theme">
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" /></svg>
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8 8 0 0 1 9.4 4a8 8 0 1 0 10.6 10.6z" /></svg>
        </button>

        <!-- App: checks for updates, then offers to install. Web: offers a reload when a newer version is out. -->
        <button class="update-btn" id="update-btn" type="button" data-state="idle" hidden>
          <span class="update-btn__icon" aria-hidden="true"></span>
          <span class="update-btn__label" id="update-label"></span>
          <!-- green: up to date; orange: a new version is out -->
          <span class="update-btn__light" aria-hidden="true"></span>
        </button>
        <span class="visually-hidden" role="status" id="update-status"></span>
      </div>
    </header>

    <nav class="devicebar" id="devicebar" aria-label="Devices"></nav>

    <main class="stage" id="stage">
      <div class="rack" id="rack"></div>
      <p class="stage__empty" id="stage-empty" hidden>No devices in view. Choose a setup or add a device from the bar above.</p>
    </main>

    <!-- Setups menu (opened by the setup button in the device bar) -->
    <div class="menu" id="setups-menu" popover></div>
    <div class="cascade" id="swap-menu" popover></div>

    <!-- Device library -->
    <dialog class="library" id="library" aria-labelledby="library-title">
      <div class="library__head">
        <h2 id="library-title">Add devices</h2>
        <label class="library__search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <span class="visually-hidden">Search devices</span>
          <input id="library-search" type="search" spellcheck="false" placeholder="Search, like Pixel, MacBook or 390" />
        </label>
        <button class="icon-btn" id="library-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
        </button>
      </div>
      <div class="library__body">
        <nav class="library__tabs" id="library-tabs" role="tablist" aria-label="Device types"></nav>
        <div class="library__panel">
          <div id="library-panel"></div>
          <form id="custom-form" class="custom-form" hidden autocomplete="off">
            <h3>New custom size</h3>
            <label class="field">
              <span>Name</span>
              <input name="name" type="text" required maxlength="40" placeholder="My phone" />
            </label>
            <div class="field-row">
              <label class="field">
                <span>Width (px)</span>
                <input name="width" type="number" required min="200" max="7680" step="1" placeholder="390" />
              </label>
              <label class="field">
                <span>Height (px)</span>
                <input name="height" type="number" required min="200" max="7680" step="1" placeholder="844" />
              </label>
            </div>
            <label class="field">
              <span>Type</span>
              <select name="category"></select>
            </label>
            <div class="dialog__actions">
              <button type="submit" class="btn btn--primary">Add custom size</button>
            </div>
          </form>
        </div>
      </div>
      <div class="library__foot">
        <span id="library-count"></span>
        <button type="button" class="btn btn--primary" id="library-done">Done</button>
      </div>
    </dialog>

    <!-- Short confirmations, like "Copied to clipboard" -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast__icon" aria-hidden="true"></span>
      <span class="toast__text"></span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
